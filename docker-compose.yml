services:
  # ── Nginx reverse proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: saana-yetu-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - app
    restart: unless-stopped

  # ── PHP backend (Apache + PHP) ───────────────────────
  app:
    build: .
    container_name: saana-yetu-app
    expose:
      - "80"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-heritage-images}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION:-auto}
    volumes:
      - ./uploads:/var/www/html/uploads
    restart: unless-stopped
