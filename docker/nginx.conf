upstream php_backend {
    server app:80;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploads (served directly for legacy files, new uploads go to R2)
    location /uploads/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== API — reverse proxy to PHP backend =====
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://php_backend;
        proxy_read_timeout 60s;
    }

    # Auth endpoints — stricter rate limiting
    location ~ ^/api/makers\.php {
        limit_req zone=auth burst=10 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://php_backend;
        proxy_read_timeout 60s;
    }

    # Upload endpoint — larger body size + stricter rate limit
    location = /api/upload.php {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 10M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://php_backend;
        proxy_read_timeout 120s;
    }

    # Serve static SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ \.(env|sql|md|git|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
